name: build

# main 브랜치 push, v* 태그 push, 수동 실행(Actions 탭 → build → Run workflow) 시 실행
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"

# 같은 브랜치에 새 push가 오면 이전 실행은 취소함
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 엔진 테스트
        working-directory: engine
        run: |
          pip install -e ".[dev]"
          pytest -q

  app:
    needs: engine-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 엔진 번들 (PyInstaller onedir)
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .
          pyinstaller -y --log-level WARN quickortho-engine.spec

      - name: 엔진 번들 동작 확인
        shell: bash
        working-directory: engine/dist/quickortho-engine
        run: |
          ./quickortho-engine version
          printf '{"job":1,"argv":["version"]}\n' | ./quickortho-engine serve | tee serve.log
          grep -q '"ok": true' serve.log
          grep -q '"type": "done", "job": 1, "code": 0' serve.log
          rm serve.log
          du -sh .

      - name: 프론트엔드 의존성 설치
        run: npm ci

      - name: 앱 빌드 (엔진 포함)
        run: npm run tauri build -- --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json

      - name: 설치파일 업로드
        uses: actions/upload-artifact@v6
        with:
          name: QuickOrtho-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  # v* 태그 push 시 설치파일을 GitHub Releases에 정식 릴리스(최신)로 올린다
  release:
    needs: app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 태그와 앱 버전 일치 확인
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          ENGINE=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('engine/quickortho_engine/__init__.py').read())[1])")
          echo "tag=$TAG app=$APP engine=$ENGINE"
          test "$TAG" = "$APP" && test "$TAG" = "$ENGINE"

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print
          gh release create "$GITHUB_REF_NAME" \
            --title "QuickOrtho ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES" \
            --latest \
            $(find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \))
